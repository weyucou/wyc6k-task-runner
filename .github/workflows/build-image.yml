name: Build and push agent-worker image

on:
  push:
    branches: [main]
  # Build only: no push and no AWS credentials, so a bad pin or Dockerfile fails the PR.
  # No `branches:` filter, so stacked PRs (base != main) also get the build.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR builds. Main pushes queue, so a running push is never cut off;
  # the queue holds one pending run, so a burst of merges skips the middle ones.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  id-token: write  # OIDC token for AWS role assumption
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # SHA pinned to v4.2.2 — update via: gh release view -R actions/checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials via OIDC
        if: github.event_name == 'push'
        # SHA pinned to v4.0.2 — update via: gh release view -R aws-actions/configure-aws-credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        if: github.event_name == 'push'
        # SHA pinned to v2.0.1 — update via: gh release view -R aws-actions/amazon-ecr-login
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      # Two build steps: the ECR tags need the ecr-login registry output, which a PR run lacks.
      - name: Build image (no push)
        if: github.event_name == 'pull_request'
        # SHA pinned to v6.14.0 — update via: gh release view -R docker/build-push-action
        uses: docker/build-push-action@0adf9959216b96bec444f325f1e493d4aa344497 # v6.14.0
        with:
          context: .
          push: false
          platforms: linux/amd64
          tags: agent-worker:pr-${{ github.event.pull_request.number }}

      - name: Build and push image
        if: github.event_name == 'push'
        # SHA pinned to v6.14.0 — update via: gh release view -R docker/build-push-action
        uses: docker/build-push-action@0adf9959216b96bec444f325f1e493d4aa344497 # v6.14.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/agent-worker:latest
            ${{ steps.ecr-login.outputs.registry }}/agent-worker:sha-${{ github.sha }}
